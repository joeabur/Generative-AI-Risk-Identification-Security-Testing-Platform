# CycloneDX SBOM (docs/BUILD_SPEC.md §23).
#
# Generated from the installed environment rather than the manifest, for the
# same reason pip-audit runs against the installed set: an SBOM that lists
# what was declared instead of what shipped describes a build nobody ran.
name: sbom

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the backend and the SBOM generator
        working-directory: backend
        run: |
          pip install -e ".[dev,appsec]"
          pip install cyclonedx-bom

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          cyclonedx-py environment --output-format json --outfile sbom/backend.cdx.json
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --output-format json \
            --output-file sbom/frontend.cdx.json \
            frontend/package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
