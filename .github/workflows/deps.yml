# Dependency advisories (docs/BUILD_SPEC.md §23).
#
# Separate from `security.yml` because it fails for a different reason: not
# "we wrote something unsafe" but "something we depend on was found unsafe",
# which needs a different person and a different fix.
name: deps

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pip-audit
      - name: pip-audit
        # The installed set, not just the declarations, so a transitive
        # dependency cannot hide behind a clean manifest. --skip-editable
        # excludes this project's own editable install: it is not published
        # to PyPI, so pip-audit otherwise treats "not found" as a collection
        # failure for a reason unrelated to any real advisory. --strict is
        # dropped because it fails on that skip too, not just on a missing
        # audit result — with our own package always producing a skip, the
        # two flags cannot be combined, and --strict cannot be satisfied at
        # all in this setup.
        #
        # Two advisories are ignored, each for a documented, currently
        # unfixable reason rather than left to fail the job silently on
        # every run:
        #   - PYSEC-2026-3807 / GHSA-9w56-46f6-3qhx (asteval 1.0.6): the
        #     fix is 1.0.9, but checkov 3.3.19 (the latest release)
        #     exact-pins asteval==1.0.6. Unpinnable from our side until
        #     checkov ships a release that moves it.
        #   - PYSEC-2026-1325 (ecdsa 0.19.2, pulled in by checkov): no fix
        #     version has been published upstream at all.
        # Revisit by re-running without these flags after a checkov bump.
        run: |
          pip install -e ".[dev,appsec]"
          pip-audit --skip-editable --progress-spinner off \
            --ignore-vuln PYSEC-2026-3807 \
            --ignore-vuln GHSA-9w56-46f6-3qhx \
            --ignore-vuln PYSEC-2026-1325

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
