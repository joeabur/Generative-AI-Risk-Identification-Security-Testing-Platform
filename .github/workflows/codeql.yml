# CodeQL (docs/BUILD_SPEC.md §23).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # The narrowest set CodeQL needs to upload its results.
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      # Deliberately not pinned to the PR head (unlike this repo's other
      # workflows): CodeQL's own guidance is to analyze the pull_request
      # event's default merge-with-base commit, so an alert reflects the
      # code as it will actually land, not the branch in isolation.
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
